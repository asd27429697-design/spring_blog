spring:
  config:
    import: optional:file:.env[.properties] #스프링 .env를 자동으로 읽지 않습니다. 읽을 수 있도록 설정 추가
  mustache:
    servlet:
      expose-session-attributes: false  # 머스태치 파일에서 세션에 담을 값을 바로 사용 가능 (false 기본값 권장)
  servlet:
    multipart:
      max-file-size: 10MB   # 파일 하나의 최대 크기
      max-request-size: 11MB   # 요청 전체(파일 + 입력값)의 최대 크기
  profiles:
    active: dev
  # 메일 발송 설정 (추가)
  mail:
    host: smtp.gmail.com        # Gmail SMTP 서버 주소
    port: 587                   # STARTTLS 포트
    username: ${MAIL_USERNAME}  # 발신 Gmail 주소 (.env)
    password: ${MAIL_PASSWORD}  # 16자리 앱 비밀번호 (.env, 구글 로그인 비밀번호 아님)
    properties:
      mail:
        smtp:
          auth: true                # SMTP 서버에 아이디, 비밀번호로 로그인
          starttls:
            enable: true            # 암호화 연결(TLS)로 전환
            required: true          # 전환에 실패하면 보내지 않음
          connectiontimeout: 5000   # 서버 연결을 기다리는 최대 시간 (밀리초)
          timeout: 5000             # 서버 응답을 기다리는 최대 시간 (밀리초)
          writetimeout: 5000        # 데이터를 보내는 데 걸리는 최대 시간 (밀리초)


server:
  servlet:
    session:
      tracking-modes: cookie    # 세션 번호를 쿠키로만 전달 (주소에 ;jsessionid 를 붙이지 않음)


# 초기 파라미터 설정
oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: ${REDIRECT_URI}

# 포트원 V2 (결제 방식)
# ":" 뒤가 비어 있으면 .env 값이 없어도 서버는 시작 됨 (결제할 때 실패)
portone:
  store-id: ${PORTONE_STORE_ID:}
  channel-key: ${PORTONE_CHANNEL_KEY:}
  api-secret: ${PORTONE_API_SECRET:}