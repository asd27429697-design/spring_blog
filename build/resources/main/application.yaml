spring:
  config:
    import: optional:file:.env[.properties] #스프링 .env를 자동으로 읽지 않습니다. 읽을 수 있도록 설정 추가
  mustache:
    servlet:
      expose-session-attributes: false  # 머스태치 파일에서 세션에 담을 값을 바로 사용 가능 (false 기본값 권장)
  profiles:
    active: local

server:
  servlet:
    session:
      tracking-modes: cookie    # 세션 번호를 쿠키로만 전달 (주소에 ;jsessionid 를 붙이지 않음)