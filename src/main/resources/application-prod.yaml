server:
  port: 5000

logging:
  level:
    root: INFO
    com.tenco.spring_blog: INFO


spring:
  # 데이터 베이스 연결 (MySQL)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # JPA 설정
  jpa:
    # true 기본 값 : 뷰 렌더링 까지 영속성 컨텍스트 유지, 지연 로깅 가능
    # false       : 트랜잭션이 끝나며 역속성 컨텍스트 종료, 지연 로딩 불가
    open-in-view: true
    hibernate:
      # 운영에서는 create 를 쓰지 않습니다. 없는 테이블과 컬럼만 추가합니다.
      default_batch_fetch_size: 10
      ddl-auto: update
    # 실행되는 SQL을 콘솔에 출력합니다
    show-sql: true
    # 추후 data.sql 을 테이블 생성 후에 실행합니다
    defer-datesource-initialization: true

